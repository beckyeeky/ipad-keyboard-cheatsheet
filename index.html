<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPad 外接键盘快捷键</title>
<style>
:root { color-scheme: light; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --bg:#f5f5f7; --card:#fff; --target:#0a66c2; --mod:#e8f1fb; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
main { max-width:1180px; margin:auto; padding:28px 20px 40px; }
h1 { font-size:28px; font-weight:650; margin:0 0 6px; }
p { margin:0; color:var(--muted); }
.note { margin-top:8px; }
nav { display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 16px; }
button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:7px 12px; font:inherit; cursor:pointer; }
button.active { background:var(--target); border-color:var(--target); color:#fff; }
.layout { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr); gap:18px; align-items:start; }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
svg { width:100%; height:auto; display:block; }
.frame { background:#fbfbfd; border:1px solid #ececf1; border-radius:12px; padding:8px; }
.key rect { fill:#fff; stroke:#c7c7cc; stroke-width:1; }
.key text { fill:#1d1d1f; font-size:11px; text-anchor:middle; dominant-baseline:middle; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.key text.small { font-size:10px; }
.key.modifier rect { fill:var(--mod); stroke:#8eb4dc; }
.key.target rect { fill:var(--target); stroke:#084e96; }
.key.target text, .key.target circle { fill:#fff; stroke:#fff; }
ul { list-style:none; padding:0; margin:0; }
li { display:grid; grid-template-columns:minmax(190px,max-content) 1fr; gap:12px; padding:8px 0; border-bottom:1px solid #eee; }
li:last-child { border-bottom:0; }
b { font-weight:620; white-space:nowrap; }
footer { margin-top:16px; color:var(--muted); font-size:13px; }
a { color:var(--target); }
@media (max-width:860px) { .layout { grid-template-columns:1fr; } li { grid-template-columns:1fr; gap:2px; } }
</style>
</head>
<body>
<main>
<h1>iPad 外接键盘快捷键</h1>
<p>只显示当前修饰键层。蓝色键是动作键，浅蓝键是需要按住的修饰键。</p>
<p class="note">第三方键盘用 Fn 代替 Globe。窗口类快捷键需要 iPadOS 26 或更新版本，并开启窗口化 App 或台前调度。</p>

</div>

</footer>
</main>

  legend.innerHTML = DATA[id].legend;
  document.querySelectorAll('button').forEach(btn => btn.classList.toggle('active', btn.dataset.layer === id));
}

});
